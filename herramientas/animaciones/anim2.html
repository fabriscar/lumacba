<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url('../fonts/bric800.ttf');}
*{margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B0B0B}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.sc{position:absolute;inset:0;overflow:hidden}
.lines div{position:absolute;left:0;width:1080px;height:3px}
.it{position:absolute;will-change:transform}
.ltr{position:absolute;font-family:B;line-height:1;white-space:pre}
.tx{position:absolute;font-family:B;line-height:1;white-space:pre;left:0;width:1080px;text-align:center}
</style></head><body><div id="stage"></div>
<script>
const Y='#FFD60A',K='#0B0B0B',CR='#FFF1B8';
const spr=t=>t<=0?0:1-Math.exp(-8*t)*Math.cos(13*t);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x,0,1),3);
const stage=document.getElementById('stage');
const meas=document.createElement('canvas').getContext('2d');
function tw(str,size){meas.font=size+'px B';return meas.measureText(str).width;}
const T=1.5,D=1.8;
const SC=[
 {k:'intro',t0:-5,bg:K,fg:Y,lc:'#fff',lo:.05,o:[540,1000]},
 {k:'maceta',n:'macetas',t0:T,bg:Y,fg:K,lc:K,lo:.06,o:[540,1020]},
 {k:'florero',n:'floreros',t0:T+D,bg:K,fg:Y,lc:'#fff',lo:.05,o:[1080,200]},
 {k:'lampara',n:'lámparas',t0:T+2*D,bg:CR,fg:K,lc:K,lo:.05,o:[0,1700]},
 {k:'colgante',n:'colgantes',t0:T+3*D,bg:Y,fg:K,lc:K,lo:.06,o:[540,1020]},
 {k:'portavelas',n:'portavelas',t0:T+4*D,bg:K,fg:Y,lc:'#fff',lo:.05,o:[1080,1700]},
 {k:'esfera',n:'esferas',t0:T+5*D,bg:CR,fg:K,lc:K,lo:.05,o:[0,200]},
 {k:'outro',t0:T+6*D,bg:Y,fg:K,lc:K,lo:.06,o:[540,960]},
];
const LET=[]; // {el,t0,sc}
const LQ=[];
function letters(sc,str,size,top,color,tl,cx=540,maxw=920){LQ.push([sc,str,size,top,color,tl,cx,maxw]);}
function letters_(sc,str,size,top,color,tl,cx=540,maxw=920){
 let s=size;const w0=tw(str,s);if(w0>maxw){s=s*maxw/w0;}
 let x=cx-tw(str,s)/2;
 [...str].forEach((ch,i)=>{const e=document.createElement('div');e.className='ltr';e.textContent=ch;e.style.fontSize=s+'px';e.style.color=color;e.style.left=x+'px';e.style.top=(top+(size-s)*0.45)+'px';e.style.transformOrigin='50% 85%';sc.el.appendChild(e);
  sc.let.push({el:e,t0:tl+i*0.045});x+=tw(ch,s)-s*0.004;});
}
function img(sc,name,h,cx,cy,src){const im=new Image();im.src=src||`anim2/obj/${name}.png`;im.className='it';im.style.height=h+'px';sc.el.appendChild(im);const o={el:im,h,cx,cy,w:0};
 im.onload=()=>{o.w=h*im.naturalWidth/im.naturalHeight;im.style.left=(cx-o.w/2)+'px';im.style.top=(cy-h/2)+'px';};return o;}
SC.forEach((s,i)=>{
 s.el=document.createElement('div');s.el.className='sc';s.el.style.background=s.bg;s.el.style.zIndex=i+1;s.let=[];
 let L='';for(let y=0;y<1920;y+=14)L+=`<div style="top:${y}px;background:${s.lc};opacity:${s.lo}"></div>`;
 const ln=document.createElement('div');ln.className='lines';ln.innerHTML=L;s.el.appendChild(ln);
 stage.appendChild(s.el);
});
// intro
{const s=SC[0];letters(s,'hecho',300,540,Y,0.15);letters(s,'en 3D.',300,830,'#ffffff',0.5);
 s.cap=img(s,'',230,540,1280,'stk/png/capa-por-capa.png');
 s.st=[img(s,'',170,880,470,'stk/png/estrella-luma.png')];}
// product scenes
const KS={maceta:.92,florero:.92,lampara:.92,colgante:.92,portavelas:.92,esfera:.92};
SC.slice(1,7).forEach((s,i)=>{
 s.cnt=document.createElement('div');s.cnt.className='tx';s.cnt.textContent='0'+(i+1)+' / 06';s.cnt.style.cssText+=`font-size:44px;top:296px;left:auto;right:70px;width:300px;text-align:right;color:${s.fg};opacity:.8`;s.el.appendChild(s.cnt);
 letters(s,s.n,175,455,s.fg,0.95);
 s.obj=img(s,s.k,0,540,1030);
 s.obj.el.onload=null;
 s.tag=document.createElement('div');s.tag.className='tx';s.tag.textContent='impreso en 3D';s.tag.style.cssText+=`font-size:58px;top:1445px;color:${s.fg}`;s.el.appendChild(s.tag);
 const a=i%2?[ 'stk/png/chispas.png',170,'stk/png/estrella-luma.png',150]:['stk/png/estrella-luma.png',170,'stk/png/chispas.png',140];
 s.sp=[img(s,'',a[1],i%2?170:900,i%2?800:760,a[0]),img(s,'',a[3],i%2?900:190,i%2?1280:1250,a[2])];
 // custom sizing of object once loaded
 const im=s.obj.el;const prev=im.onload;
 im.addEventListener('load',()=>{const nh=im.naturalHeight,nw=im.naturalWidth;const sizeH=(KS[s.k])*(nh/900)*900*0.0+Math.min(740,740*0.98);
  let h=Math.min(740,(nh/Math.max(nh,nw))*900*0.83); let w=h*nw/nh; if(w>760){w=760;h=w*nh/nw;}
  s.obj.h=h;s.obj.w=w;im.style.height=h+'px';im.style.left=(540-w/2)+'px';im.style.top=(1030-h/2)+'px';});
});
// outro
{const s=SC[7];letters(s,'y mucho',250,420,K,0.2);letters(s,'más.',250,670,K,0.45);
 s.mini=['maceta','florero','lampara','colgante','portavelas','esfera'].map((n,i)=>{const o=img(s,n,0,110+i*172,1040);const im=o.el;im.addEventListener('load',()=>{let h=210,w=h*im.naturalWidth/im.naturalHeight;if(w>162){w=162;h=w*im.naturalHeight/im.naturalWidth;}o.h=h;o.w=w;im.style.height=h+'px';im.style.left=(o.cx-w/2)+'px';im.style.top=(1040-h/2)+'px';});o.i=i;return o;});
 s.pill=img(s,'',230,540,1330,'stk/png/pedilo-en-la-web.png');
 s.hd=document.createElement('div');s.hd.className='tx';s.hd.textContent='@3dluma.cba';s.hd.style.cssText+='font-size:62px;top:1480px;color:#0B0B0B';s.el.appendChild(s.hd);}
// persistent badge
const badge=img({el:stage},'luma-badge-negro',150,240,330,'stk/png/luma-badge-negro.png');badge.el.style.zIndex=100;
document.fonts.load('100px B').then(()=>{LQ.forEach(a=>letters_(...a));window.fontsReady=true;});

function pop(el,tt,amt){const s=spr(tt);return s;}
function render(t){
 SC.forEach((s,i)=>{
  const tl=t-s.t0;
  // wipe
  if(i>0){const R=ease(tl/0.55)*2500;const vis=tl>0;s.el.style.display=vis?'block':'none';s.el.style.clipPath=tl>=0.6?'none':`circle(${R}px at ${s.o[0]}px ${s.o[1]}px)`;}
  const nxt=SC[i+1];if(nxt&&t>nxt.t0+0.6&&i>0)s.el.style.display='none';
  if(!(i===0||tl>0))return;
  // letters
  s.let.forEach(l=>{const tt=(tl-l.t0)/0.5;const sp=spr(tt);l.el.style.opacity=clamp(tt*5,0,1);l.el.style.transform=`translateY(${(1-sp)*140}px) scale(${clamp(sp,0,1.2)}) rotate(${(1-sp)*-10}deg)`;});
  if(s.k==='intro'){
   const tt=(t-0.9)/0.7,sp=spr(tt);const c=s.cap;c.el.style.opacity=tt>0?1:0;c.el.style.transform=`translateY(${(1-sp)*500}px) rotate(${-4+(1-sp)*10}deg) scale(${clamp(sp,0,1.1)*(1+0.03*Math.sin(t*5))})`;
   const t2=(t-1.0)/0.6,s2=spr(t2);const st=s.st[0];st.el.style.opacity=t2>0?1:0;st.el.style.transform=`rotate(${(1-s2)*300+Math.sin(t*3)*8}deg) scale(${clamp(s2,0,1.2)})`;
  } else if(s.k==='outro'){
   s.mini.forEach(o=>{const tt=(tl-0.9-o.i*0.09)/0.6,sp=spr(tt);o.el.style.opacity=tt>0?1:0;o.el.style.transform=`translateY(${(1-sp)*400+Math.sin(t*2.4+o.i)*9}px) rotate(${(1-sp)*40+Math.sin(t*2+o.i)*3}deg) scale(${clamp(sp,0,1.15)})`;});
   const tt=(tl-1.5)/0.7,sp=spr(tt);s.pill.el.style.opacity=tt>0?1:0;s.pill.el.style.transform=`translateY(${(1-sp)*500}px) rotate(-2deg) scale(${1+0.035*Math.sin(Math.max(0,tl-2.2)*5)})`;
   const t3=(tl-1.9)/0.5,s3=spr(t3);s.hd.style.opacity=clamp(t3*3,0,1);s.hd.style.transform=`translateY(${(1-s3)*60}px)`;
  } else {
   // counter/tag
   s.cnt.style.opacity=.8*clamp((tl-0.3)/0.2,0,1);
   const tg=(tl-1.35)/0.5,sg=spr(tg);s.tag.style.opacity=clamp(tg*4,0,1);s.tag.style.transform=`translateY(${(1-sg)*60}px)`;
   // object layer-reveal
   const o=s.obj,im=o.el;const p=clamp((tl-0.25)/0.75,0,1);const steps=18;const q=Math.floor(p*steps)/steps;
   im.style.clipPath=p>=1?'none':`inset(${(1-q)*100}% 0 0 0)`;
   im.style.opacity=tl>0.25?1:0;
   const jx=p<1?(Math.floor(p*steps)%2?3:-3):0;
   const tau=Math.max(0,tl-1.0);let sc=1,rot=0,dy=0;
   if(tl>1.0){sc=1+0.08*Math.exp(-5*tau)*Math.cos(16*tau);rot=5*Math.exp(-4*tau)*Math.sin(18*tau);dy=Math.sin(tl*2.4)*10*clamp(tau*2,0,1);}
   im.style.transform=`translate(${jx}px,${dy}px) rotate(${rot}deg) scale(${sc})`;
   s.sp.forEach((o2,j)=>{const tt=(tl-1.05-j*0.18)/0.6,sp=spr(tt);o2.el.style.opacity=tt>0?1:0;o2.el.style.transform=`rotate(${(1-sp)*260*(j?-1:1)+Math.sin(tl*3+j)*10}deg) scale(${clamp(sp,0,1.2)})`;});
  }
 });
}
window.render=render;
</script></body></html>
